name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        continue-on-error: true
        run: |
          {
            echo '=== install start ==='
            brew install ldid xz make 2>&1 || true
            git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos 2>&1 || true
            echo '=== install done ==='
          } > build.log 2>&1
          true
      - name: Build tweak
        continue-on-error: true
        run: |
          {
            echo '=== build start ==='
            export THEOS=$HOME/theos
            export PATH=$THEOS/bin:$PATH
            make clean 2>&1 || true
            make package FINALPACKAGE=1 2>&1 || make package 2>&1 || true
            echo '=== build done ==='
          } >> build.log 2>&1
          true
      - name: Collect
        continue-on-error: true
        run: |
          mkdir -p out
          find . -name '*.dylib' -exec cp {} out/ \; 2>/dev/null || true
          find . -name '*.deb' -exec cp {} out/ \; 2>/dev/null || true
          cp build.log out/ 2>/dev/null || true
          ls -la out/ || true
          true
      - name: Show build log
        continue-on-error: true
        run: |
          echo '=========== BUILD LOG ==========='
          cat build.log 2>/dev/null || echo 'no log'
          echo '=========== END LOG ==========='
          true
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/*
          if-no-files-found: warn