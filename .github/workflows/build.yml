name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          brew install ldid xz make || true
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos || true
      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1 || make package || make
      - name: Collect
        run: |
          mkdir -p out
          find . -name '*.dylib' -exec cp {} out/ \; || true
          find . -name '*.deb' -exec cp {} out/ \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/*
          if-no-files-found: warn